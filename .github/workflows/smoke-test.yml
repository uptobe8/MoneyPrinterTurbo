name: Smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t moneyprinterturbo .
      - run: docker run -d --name moneyprinterturbo -p 8501:8501 moneyprinterturbo
      - run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 5
          done
          docker logs moneyprinterturbo
          exit 1
