name: MoneyPrinterTurbo Testimonial V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testimonial-v1-moneyprinter.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Download MoneyPrinterTurbo
        run: git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git app

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install MoneyPrinterTurbo
        working-directory: app
        run: |
          uv python install 3.11
          uv sync --frozen

      - name: Configure providers
        working-directory: app
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          import json, os
          from pathlib import Path
          g=os.environ['GEMINI_API_KEY'].strip()
          p=os.environ['PEXELS_API_KEY'].strip()
          if not g or not p:
              raise SystemExit('Missing GEMINI_API_KEY or PEXELS_API_KEY')
          f=Path('config.toml')
          s=f.read_text(encoding='utf-8')
          s=s.replace('gemini_api_key = ""', f'gemini_api_key = {json.dumps(g)}', 1)
          s=s.replace('gemini_model_name = ""', 'gemini_model_name = "gemini-3.5-flash-lite"', 1)
          s=s.replace('pexels_api_keys = []', f'pexels_api_keys = [{json.dumps(p)}]', 1)
          if 'llm_provider = "moonshot"' in s:
              s=s.replace('llm_provider = "moonshot"','llm_provider = "gemini"',1)
          f.write_text(s,encoding='utf-8')
          PY

      - name: Generate exact testimonial with MoneyPrinterTurbo
        working-directory: app
        shell: bash
        run: |
          SCRIPT=$(cat <<'EOF'
          Este piso llevaba muchísimo tiempo abandonado… y tenía una deuda que parecía imposible de resolver.

          La comunidad ya no sabía qué hacer. Cada mes que pasaba, el problema iba creciendo.

          Pero nos pusimos manos a la obra y, en solo seis meses, conseguimos solucionarlo todo. Hoy ese piso ya no tiene ninguna deuda.

          Y ahora viven aquí una pareja joven con sus dos niños. Da gusto ver cómo un problema tan grande se ha convertido en un nuevo comienzo.

          Para mí, eso es lo más bonito de este trabajo.
          EOF
          )

          TERMS='middle aged Spanish female property manager walking inside apartment building entrance lobby,middle aged Spanish female property manager apartment mailbox old letters administrative documents table,middle aged Spanish female property manager seated office desk talking naturally camera,young Spanish couple entering apartment building with two happy children family home,middle aged Spanish female property manager emotional close up apartment lobby'

          uv run python cli.py \
            --video-script "$SCRIPT" \
            --video-terms "$TERMS" \
            --video-language es-ES \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --video-concat-mode sequential \
            --video-transition-mode fade-in \
            --video-clip-duration 7 \
            --match-materials-to-script \
            --voice-name es-ES-XimenaNeural-Female \
            --voice-rate 1.10 \
            --voice-volume 1.0 \
            --bgm-type random \
            --bgm-volume 0.10 \
            --subtitle-enabled \
            --subtitle-display-mode sentence \
            --subtitle-position bottom \
            --video-count 1 \
            | tee ../testimonial-result.json

      - name: Find and verify MP4
        shell: bash
        run: |
          VIDEO=$(find app/storage/tasks -type f -name 'final-1.mp4' | head -n1)
          test -n "$VIDEO"
          test -s "$VIDEO"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO" | tee testimonial-ffprobe.txt
          cp "$VIDEO" testimonial-v1-moneyprinter.mp4
          mkdir -p testimonial-frames
          ffmpeg -y -i testimonial-v1-moneyprinter.mp4 -vf "fps=1/7,scale=360:-2" -frames:v 6 testimonial-frames/frame-%02d.jpg >/dev/null 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: testimonial-v1-moneyprinter
          path: |
            testimonial-v1-moneyprinter.mp4
            testimonial-ffprobe.txt
            testimonial-result.json
            testimonial-frames/
          retention-days: 1
