name: Public MoneyPrinterTurbo Online

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/public-moneyprinterturbo.yml'

concurrency:
  group: public-moneyprinterturbo-online
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download MoneyPrinterTurbo
        run: git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git app

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install Python and MoneyPrinterTurbo
        working-directory: app
        run: |
          uv python install 3.11
          uv sync --frozen

      - name: Launch MoneyPrinterTurbo
        working-directory: app
        run: |
          nohup uv run streamlit run ./webui/Main.py             --server.address=0.0.0.0             --server.port=8501             --server.enableCORS=true             --browser.gatherUsageStats=false             --client.toolbarMode=minimal             --logger.hideWelcomeMessage=true             --server.showEmailPrompt=false             > ../app.log 2>&1 &
          echo $! > ../app.pid

      - name: Verify MoneyPrinterTurbo
        run: |
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Install Cloudflare tunnel
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Publish online
        run: |
          ./cloudflared tunnel --url http://127.0.0.1:8501 --no-autoupdate > tunnel.log 2>&1 &
          for i in {1..60}; do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "$URL" | tee public-url.txt
              echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          cat tunnel.log
          exit 1

      - name: Verify public URL
        run: |
          for i in {1..30}; do
            if curl -LfsS "$PUBLIC_URL/_stcore/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: public-url
          path: public-url.txt
          retention-days: 1

      - name: Save URL
        continue-on-error: true
        run: |
          cp public-url.txt PUBLIC_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add PUBLIC_URL.txt
          git commit -m "Update live MoneyPrinterTurbo URL" || true
          git push || true

      - name: Keep online
        if: always()
        run: sleep 21000
