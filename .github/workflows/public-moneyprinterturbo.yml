name: Public MoneyPrinterTurbo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/public-moneyprinterturbo.yml'
      - 'Dockerfile'

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t moneyprinterturbo .
      - name: Run
        run: docker run -d --name moneyprinterturbo -p 8501:8501 moneyprinterturbo
      - name: Health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs moneyprinterturbo
          exit 1
      - name: Install tunnel
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
      - name: Publish
        run: |
          ./cloudflared tunnel --url http://127.0.0.1:8501 --no-autoupdate > tunnel.log 2>&1 &
          for i in {1..60}; do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "$URL" | tee public-url.txt
              echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              echo "### $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          cat tunnel.log
          exit 1
      - name: Verify public URL
        run: |
          for i in {1..30}; do
            if curl -LfsS "$PUBLIC_URL/_stcore/health" >/dev/null; then
              echo "PUBLIC_URL=$PUBLIC_URL"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: public-url
          path: public-url.txt
          retention-days: 1
      - name: Save URL
        run: |
          cp public-url.txt PUBLIC_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLIC_URL.txt
          git commit -m "Update live MoneyPrinterTurbo URL" || true
          git push
      - name: Keep alive
        run: sleep 21000
