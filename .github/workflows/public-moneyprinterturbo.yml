name: MoneyPrinterTurbo Online

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/public-moneyprinterturbo.yml'

concurrency:
  group: moneyprinterturbo-online
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Download MoneyPrinterTurbo
        run: git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git app

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install MoneyPrinterTurbo
        working-directory: app
        run: |
          uv python install 3.11
          uv sync --frozen

      - name: Configure free online setup
        working-directory: app
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          gemini_key = os.environ.get('GEMINI_API_KEY', '').strip()
          pexels_key = os.environ.get('PEXELS_API_KEY', '').strip()
          if not gemini_key or not pexels_key:
              raise SystemExit('Missing required repository secrets')

          p = Path('config.toml')
          s = p.read_text(encoding='utf-8')

          s = s.replace('video_source = "pexels"', 'video_source = "pexels"', 1)
          s = s.replace('pexels_api_keys = []', f'pexels_api_keys = [{json.dumps(pexels_key)}]', 1)
          s = s.replace('gemini_api_key = ""', f'gemini_api_key = {json.dumps(gemini_key)}', 1)
          s = s.replace('gemini_model_name = ""', 'gemini_model_name = "gemini-flash-latest"', 1)

          if 'llm_provider = "moonshot"' in s:
              s = s.replace('llm_provider = "moonshot"', 'llm_provider = "gemini"', 1)
          elif 'llm_provider =' not in s:
              s = s.replace('[app]\n', '[app]\nllm_provider = "gemini"\n', 1)

          ui_marker = '[ui]\n'
          ui_values = '''[ui]\nhide_log = false\nopen_task_folder_on_completion = false\nlanguage = "es"\nvideo_language = "es-ES"\nparagraph_number = 3\nvideo_concat_mode = "random"\nvideo_transition_mode = "FadeIn"\nvideo_aspect_pexels = "9:16"\nvideo_fit_mode = "cover"\nvideo_clip_duration = 3\nvideo_clip_speed = 1.0\nvideo_count = 1\ntts_server = "azure-tts-v1"\nvoice_name = "es-ES-ElviraNeural-Female"\nvoice_mode = "tts"\nvoice_volume = 1.0\nvoice_rate = 1.0\nbgm_type = "random"\nbgm_volume = 0.15\nsubtitle_enabled = true\nsubtitle_display_mode = "sentence"\nsubtitle_animation = "none"\n'''

          start = s.find(ui_marker)
          if start != -1:
              before = s[:start]
              s = before + ui_values

          p.write_text(s, encoding='utf-8')
          PY

      - name: Launch MoneyPrinterTurbo
        working-directory: app
        run: |
          nohup uv run streamlit run ./webui/Main.py \
            --server.address=0.0.0.0 \
            --server.port=8501 \
            --server.enableCORS=true \
            --browser.gatherUsageStats=false \
            --client.toolbarMode=minimal \
            --logger.hideWelcomeMessage=true \
            --server.showEmailPrompt=false \
            > ../app.log 2>&1 &
          echo $! > ../app.pid

      - name: Verify app
        run: |
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Install Cloudflare tunnel
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Publish app online
        run: |
          ./cloudflared tunnel --url http://127.0.0.1:8501 --no-autoupdate > tunnel.log 2>&1 &
          for i in {1..90}; do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "$URL" | tee public-url.txt
              echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          cat tunnel.log
          exit 1

      - name: Verify public app
        run: |
          for i in {1..45}; do
            if curl -LfsS "$PUBLIC_URL/_stcore/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Save live URL
        run: |
          cp public-url.txt PUBLIC_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add PUBLIC_URL.txt
          git commit -m "Update MoneyPrinterTurbo online URL" || true
          git push || true

      - uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-url
          path: public-url.txt
          retention-days: 1

      - name: Keep app online
        run: sleep 21000
